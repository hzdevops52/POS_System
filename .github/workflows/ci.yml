
name: HZ Retail POS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate application and build images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend syntax
        run: npm run check --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build normal frontend
        run: npm run build --prefix frontend

      - name: Build static showcase for GitHub Pages
        env:
          VITE_STATIC_DEMO: "true"
        run: npm run build --prefix frontend

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Build backend Docker image
        run: docker build -t hz-retail-pos-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t hz-retail-pos-frontend:ci ./frontend

  deploy-pages:
    name: Deploy showcase to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate-and-build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
