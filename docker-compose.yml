services:
  mongo:
    image: mongo:8
    container_name: hz-retail-pos-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - pos_mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "5000"
      CLIENT_URL: http://localhost:8082
      MONGODB_URI: mongodb://mongo:27017/hz_retail_pos?directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pos_mongodb_data:
